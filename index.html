<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- Zoom locked: maximum-scale + user-scalable=no (gestures also blocked in app.js for iOS) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doc Swap</title>
<meta name="description" content="Convert, merge and tidy PDFs, Word, Excel and images on your device. Nothing gets uploaded.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">

<!-- iPhone / iPad home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doc Swap">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<link rel="preload" href="jakarta-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Doc Swap home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--accent)"/>
        <path d="M9 12h12.5m-3.5-3.5 3.5 3.5-3.5 3.5M23 20H10.5m3.5-3.5L10.5 20l3.5 3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Doc Swap</span>
    </a>
    <span class="pill"><i></i>On-device</span>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>Files are processed on your device and never uploaded.</footer>

<script src="app.js"></script>
</body>
</html>
